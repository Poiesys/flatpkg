<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Bus policy for flatpkg's flatpak system helper
  (org.freedesktop.Flatpak.SystemHelper, src/daemon/systemhelper.c).

  Upstream's helper is guarded by polkit; flatpkg's trust boundary is
  the "flatpkg" group, which this policy lets own the name and send it
  calls.  The helper re-checks the caller's group membership itself, so
  the policy is the outer of two checks.
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.Flatpak.SystemHelper"/>
    <allow send_destination="org.freedesktop.Flatpak.SystemHelper"/>
  </policy>

  <policy group="flatpkg">
    <allow send_destination="org.freedesktop.Flatpak.SystemHelper"/>
  </policy>

  <!-- Sandboxed apps reach the helper through the xdg-dbus-proxy of
       their own session, which connects to the system bus as the
       invoking user; the group policy above is what authorizes them. -->
  <policy context="default">
    <deny own="org.freedesktop.Flatpak.SystemHelper"/>
    <allow send_destination="org.freedesktop.Flatpak.SystemHelper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.Flatpak.SystemHelper"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
