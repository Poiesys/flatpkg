# Commands flatpkgd runs for D-Bus system-helper requests.  The first word
# must be an absolute path.  Placeholders: %r ref, %i installation,
# %b bundle path, %n remote, %o origin, %a arch, %f flags.
# An empty or missing entry is refused; the daemon does not guess a
# fallback.
#
# flatpkg's own CLI would perform the full transaction (including orphan
# removal); point this at any compatible client instead:
uninstall = /usr/local/sbin/flatpkg uninstall -y -- %r
deploy-appstream = /usr/local/sbin/flatpkg update --appstream --remote=%o --arch=%a
deploy = /usr/local/sbin/flatpkg install -y -- %r
install-bundle = /usr/local/sbin/flatpkg install -y --from %b
configure-remote-add = /usr/local/sbin/flatpkg remote-add %n %u
configure-remote-remove = /usr/local/sbin/flatpkg remote-delete %n

# cancel-pull = /path/to/your-client cancel-pull %d %f %i
# configure = /path/to/your-client configure %k %v %f %i
# configure-remote-add = /path/to/your-client configure-remote-add %n %u %f %i
# configure-remote-remove = /path/to/your-client configure-remote-remove %n %f %i
# deploy = /path/to/your-client deploy %p %r %o %f %s %P %i
# deploy-appstream = /path/to/your-client deploy-appstream %p %o %a %f %i
# ensure-repo = /path/to/your-client ensure-repo %f %i
# generate-oci-summary = /path/to/your-client generate-oci-summary %o %f %i
# install-bundle = /path/to/your-client install-bundle %b %f %n %i
# update --appstream is what Bazaar/host flatpak calls; the default entry
# above does it through the flatpkg CLI.
# prune-local-repo = /path/to/your-client prune-local-repo %f %i
# remove-local-ref = /path/to/your-client remove-local-ref %n %r %f %i
# run-triggers = /path/to/your-client run-triggers %f %i
# update-remote = /path/to/your-client update-remote %n %S %G %f %i
# update-summary = /path/to/your-client update-summary %f %i
