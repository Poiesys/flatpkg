name: CodeQL

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '43 1 * * 0'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v7

    # Build mode "none": the tree is FreeBSD-only, so nothing compiles on the
    # runner.  CodeQL reads the C as written.
    - uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: none

    - uses: github/codeql-action/analyze@v4
