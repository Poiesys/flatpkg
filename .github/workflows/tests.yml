name: Tests

# The tree is FreeBSD-only, so the suite runs on a FreeBSD machine or not at
# all.  This job is the only place the guards are exercised outside a
# developer's box; a red run is the point of it.
#
# Skips are failures here.  A guard that cannot run on the box the project
# chose is a guard that should run: the session-bus proxy and a headless
# compositor are installed for the portal and visual guards,
# FLATPKG_SANDBOX_LAUNCH turns on the real launches, and the sanctioned app is
# installed because the visual guards take their inventory from what is
# present.  If a new guard skips, install what it needs or say in its own
# output why it cannot run - do not let the number read "green".
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    # Real launches, a runtime pull and the visual passes are minutes each.
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@v7

    # The image is named rather than looked up from the version: the suite
    # means what it says only on the release the port is developed against.
    - name: Run the suite on FreeBSD
      uses: cross-platform-actions/action@v0.27.0
      with:
        operating_system: freebsd
        version: '15.1'
        architecture: x86-64
        image_url: https://github.com/cross-platform-actions/freebsd-builder/releases/download/v0.17.0/freebsd-15.1-x86-64.qcow2
        memory: 4096
        cpu_count: 2
        # libjail and libnv are part of the base system, and libostree is not
        # in the package repository: the tree carries it as an overlay port.
        # The VM ships no ports tree, so the recipe applies the port's own
        # tarball, patches and configure arguments.  zig cc builds the
        # Linux-ELF shims and the Linuxulator runs them, so the shim guards
        # get a Linux base and module; python3 is what one of them generates
        # its syscall table with, and git is what the distinfo guard lists the
        # tree with.  xdg-dbus-proxy, wlmaker with its headless backend,
        # Xwayland, grim and foot are what the portal and visual guards need
        # (wlmaker starts foot on its own).
        run: |
          sudo pkg update -f
          # linux_base's PRE-INSTALL refuses without 64-bit Linux support, so
          # the module has to be loaded before the package is installed.
          sudo kldload linux64 || true
          kldstat | grep -q 'linux64.ko' ||
            { echo "linux64 did not load" >&2; exit 1; }
          sudo pkg install -y zig pkgconf dbus glib git gmake \
            autoconf automake libtool bison gettext-runtime \
            libarchive libgpg-error gpgme libsoup3 e2fsprogs-core \
            python3 linux_base-rl9 \
            xdg-dbus-proxy wayland wlmaker xwayland grim foot
          sh scripts/ci-libostree.sh
          make
          sudo make install
          # make install adds libflatpkg_shared.so after ci-libostree.sh last
          # ran ldconfig, so put the hints back for the daemon to load it.
          sudo /sbin/ldconfig -m /usr/local/lib || true

          # The daemon is root's and the suite is the caller's, the same split
          # as a developer's box.  mdo is how the guards reach root.  The
          # group must exist before dbus reads its policy and before the
          # daemon makes the run directory root:flatpkg 0770.
          sudo pw groupadd flatpkg || true
          sudo pw groupmod flatpkg -m "$(id -un)"
          sudo sysctl security.bsd.unprivileged_setcred=1 || true
          sudo sysrc dbus_enable=YES
          sudo service dbus start
          sudo sysrc flatpkgd_enable=YES
          sudo service flatpkgd start

          # The socket is 0660 root:flatpkg inside a 0770 directory, and this
          # ssh session's supplementary groups predate the groupadd, so an
          # unprivileged test -S answers EACCES and reads as "absent".  Ask
          # as root, and show the daemon's log on a real timeout.
          socket_wait=0
          while ! sudo test -S /var/run/flatpkg/control.sock && [ "$socket_wait" -lt 240 ]; do
            sleep 0.25
            socket_wait=$((socket_wait + 1))
          done
          if ! sudo test -S /var/run/flatpkg/control.sock; then
            echo "flatpkgd did not create /var/run/flatpkg/control.sock" >&2
            sudo service flatpkgd status || true
            sudo tail -n 100 /var/log/flatpkgd.log 2>&1 || true
            sudo tail -n 100 /var/log/messages 2>&1 || true
            exit 1
          fi

          # The sanctioned app for sandbox-launch.sh and spawn-signal-scope.sh.
          # It draws on the off-screen compositor too, so it is also what the
          # visual guard's inventory holds.
          sudo flatpkg remote-add --if-not-exists flathub \
              https://dl.flathub.org/repo/ || true
          sudo flatpkg install -y com.github.tchx84.Flatseal

          # The image is small and the toolchain plus a runtime with its
          # extension pulls fill it; the package cache is pure waste by now,
          # and a leftover libostree build tree lands in /tmp.
          sudo pkg clean -a -y || true
          sudo rm -rf /tmp/libostree-ci.* || true
          df -h / 2>&1 || true

          # No skip survives: FLATPKG_STRICT_SKIPS turns every SKIP into a
          # failure that names the guard and its reason.  Re-enter as the same
          # user so sudo rebuilds the group set from /etc/group; otherwise
          # this session cannot connect to the daemon's 0660 socket either.
          sudo -u "$(id -un)" env HOME="$HOME" PATH="$PATH" \
              FLATPKG_STRICT_SKIPS=1 FLATPKG_SANDBOX_LAUNCH=1 \
              sh tests/run-suite.sh
